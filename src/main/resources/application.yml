spring:
  profiles:
    default: dev
server:
  error:
    include-message: never
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-jwt-secret-to-a-long-random-value-123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  ai:
    api-key: ${AI_API_KEY:dev-ai-api-key-change-me}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
