spring:
  datasource:
    url: jdbc:h2:mem:energie;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      data-locations: classpath:data-test.sql
app:
  mail:
    enabled: true
    from: no-reply@test.ecoreno.local
  jwt:
    secret: test-jwt-secret-that-is-at-least-thirty-two-characters-long
    expiration-ms: 86400000
  ai:
    api-key: test-ai-key
  cors:
    allowed-origins: http://localhost:*
